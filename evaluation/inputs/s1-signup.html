<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account</title>
<style>body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0}.box{width:380px;margin:30px auto;background:#fff;padding:24px;border:1px solid #ddd}
h1{font-size:22px;margin:0 0 6px}p.sub{color:#888;font-size:13px;margin:0 0 18px}label{display:block;font-size:12px;color:#888;margin:12px 0 3px}
input,select{width:100%;box-sizing:border-box;height:32px;border:1px solid #ccc;padding:0 8px;font-size:13px}
.row{display:flex;gap:8px}.row>div{flex:1}.hint{font-size:11px;color:#aaa}.btn{margin-top:18px;width:100%;height:36px;background:#2b7de9;color:#fff;border:0;font-size:14px}
.alt{text-align:center;font-size:12px;margin-top:14px;color:#888}.alt a{color:#2b7de9}.chk{font-size:12px;color:#888;margin-top:12px}</style></head><body>
<div class="box"><h1>Create your account</h1><p class="sub">Start your 14-day free trial. No credit card required.</p>
<div class="row"><div><label for="fn">First name</label><input id="fn"></div><div><label for="ln">Last name</label><input id="ln"></div></div>
<label for="em">Work email</label><input id="em" type="email"><label for="pw">Password</label><input id="pw" type="password"><div class="hint">At least 8 characters, one number</div>
<label for="co">Company size</label><select id="co"><option>1-10</option><option>11-50</option><option>51-200</option><option>201+</option></select>
<div class="chk"><input type="checkbox" id="t" style="width:auto;height:auto"> <label for="t" style="display:inline;font-size:12px">I agree to the Terms of Service and Privacy Policy</label></div>
<button class="btn">Create account</button><div class="alt">Already have an account? <a href="#">Sign in</a></div>
<div class="alt">or <a href="#">Continue with Google</a></div></div></body></html>
