<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>رزرو نوبت</title>
<style>
:root{
  --bg:#f4f6f8;--surface:#fff;--ink:#14202b;--ink2:#566574;--ink3:#8a97a4;
  --line:#e3e8ed;--brand:#0b6e8a;--brand-d:#085870;--brand-t:#e4f2f6;--gold:#e0a21a;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0 auto;max-width:430px;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:"Vazirmatn","IRANSans",Tahoma,"Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.7;padding-bottom:112px}
button{font:inherit;color:inherit}
.top{background:var(--surface);position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding:12px 16px;border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:17px;font-weight:700;flex:1}
.back{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer}
.back svg{width:20px;height:20px}
main{padding:16px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(20,32,43,.05)}
.doc{display:flex;gap:14px;align-items:center}
.av{width:64px;height:64px;border-radius:50%;background:var(--brand-t);display:grid;place-items:center;flex:none}
.av svg{width:34px;height:34px}
.nm{font-size:17px;font-weight:700;line-height:1.5}
.sp{color:var(--ink2);font-size:13px}
.rate{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:13px;color:var(--ink2)}
.rate b{color:var(--ink);font-size:14px}
.rate svg{width:16px;height:16px;fill:var(--gold)}
h2{font-size:15px;font-weight:700;margin:0 0 12px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.d{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 0;min-height:64px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--ink2)}
.d b{font-size:17px;color:var(--ink);font-weight:700;line-height:1.4}
.d[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.d[aria-pressed=true] b{color:#fff}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.t{min-height:44px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;color:var(--ink)}
.t[aria-pressed=true]{background:var(--brand-t);border:2px solid var(--brand);color:var(--brand-d)}
.t:disabled{background:#f1f3f5;color:#a5afb9;text-decoration:line-through;cursor:not-allowed;font-weight:400}
.legend{display:flex;gap:14px;margin-top:12px;font-size:12px;color:var(--ink3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.pick{display:flex;align-items:center;gap:8px;background:var(--brand-t);color:var(--brand-d);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-weight:600;font-size:13px}
.pick svg{width:18px;height:18px;flex:none}
.fee{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;font-size:14px;color:var(--ink2)}
.fee span:last-child{color:var(--ink);font-variant-numeric:tabular-nums}
.fee.total{border-top:1px dashed var(--line);margin-top:6px;padding-top:14px;color:var(--ink);font-size:15px}
.fee.total span:last-child{font-size:17px;color:var(--brand-d);font-weight:700}
.bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--surface);
  border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px;z-index:6}
.bar .sum{display:flex;flex-direction:column;line-height:1.4;min-width:0}
.bar .sum small{color:var(--ink3);font-size:12px}
.bar .sum b{font-size:15px;white-space:nowrap}
.btn{flex:1;height:50px;border:0;border-radius:14px;background:var(--brand);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.btn:active{background:var(--brand-d)}
.btn[disabled]{background:#b9c4cc;cursor:not-allowed}
.btn.done{background:#1f8a5b}
:focus-visible{outline:3px solid #5bb5cf;outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.d,.t,.btn{transition:background .15s,border-color .15s,color .15s}}
</style>
</head>
<body>
<header class="top">
  <button class="back" aria-label="بازگشت" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="#14202b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
  <h1>رزرو نوبت از دکتر</h1>
</header>
<main>
  <section class="card doc" aria-label="مشخصات پزشک">
    <div class="av" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#0b6e8a" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></div>
    <div>
      <div class="nm">دکتر مریم رضایی</div>
      <div class="sp">متخصص پوست و مو - ۱۲ سال سابقه</div>
      <div class="rate"><svg viewBox="0 0 24 24"><path d="M12 2l3 6.9 7.5.7-5.7 5 1.7 7.4L12 18l-6.5 4 1.7-7.4-5.7-5 7.5-.7z"/></svg><b>۴٫۷</b> از ۵ (۳۱۲ نظر)</div>
    </div>
  </section>

  <section class="card" aria-labelledby="h-day">
    <h2 id="h-day">انتخاب روز</h2>
    <div class="days" id="days">
      <button type="button" class="d" aria-pressed="true" data-l="شنبه ۲۴ آبان">شنبه<b>۲۴</b>آبان</button>
      <button type="button" class="d" aria-pressed="false" data-l="یکشنبه ۲۵ آبان">یکشنبه<b>۲۵</b>آبان</button>
      <button type="button" class="d" aria-pressed="false" data-l="دوشنبه ۲۶ آبان">دوشنبه<b>۲۶</b>آبان</button>
      <button type="button" class="d" aria-pressed="false" data-l="سه‌شنبه ۲۷ آبان">سه‌شنبه<b>۲۷</b>آبان</button>
      <button type="button" class="d" aria-pressed="false" data-l="چهارشنبه ۲۸ آبان">چهارشنبه<b>۲۸</b>آبان</button>
    </div>
  </section>

  <section class="card" aria-labelledby="h-time">
    <h2 id="h-time">انتخاب ساعت</h2>
    <div class="slots" id="slots">
      <button type="button" class="t" disabled aria-pressed="false">۰۹:۰۰</button>
      <button type="button" class="t" aria-pressed="false">۰۹:۳۰</button>
      <button type="button" class="t" aria-pressed="true">۱۰:۰۰</button>
      <button type="button" class="t" aria-pressed="false">۱۰:۳۰</button>
      <button type="button" class="t" disabled aria-pressed="false">۱۱:۰۰</button>
      <button type="button" class="t" aria-pressed="false">۱۱:۳۰</button>
      <button type="button" class="t" aria-pressed="false">۱۶:۰۰</button>
      <button type="button" class="t" aria-pressed="false">۱۶:۳۰</button>
    </div>
    <div class="legend"><span><i style="background:var(--brand-t);border:2px solid var(--brand)"></i>انتخاب‌شده</span><span><i style="background:#f1f3f5"></i>پر شده</span></div>
  </section>

  <section class="card" aria-labelledby="h-sum">
    <h2 id="h-sum">خلاصه نوبت</h2>
    <div class="pick" aria-live="polite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg><span id="pick">شنبه ۲۴ آبان، ساعت ۱۰:۰۰</span></div>
    <div class="fee"><span>ویزیت حضوری</span><span>۴۵۰٬۰۰۰ تومان</span></div>
    <div class="fee"><span>هزینه خدمات</span><span>۲۰٬۰۰۰ تومان</span></div>
    <div class="fee total"><b>مبلغ قابل پرداخت</b><b>۴۷۰٬۰۰۰ تومان</b></div>
  </section>
</main>

<div class="bar">
  <div class="sum"><small>مبلغ قابل پرداخت</small><b>۴۷۰٬۰۰۰ تومان</b></div>
  <button class="btn" id="pay" type="button">تأیید و پرداخت</button>
</div>

<script>
(function(){
  var day=document.querySelector('.d[aria-pressed=true]'),time=document.querySelector('.t[aria-pressed=true]');
  var pick=document.getElementById('pick'),pay=document.getElementById('pay');
  function upd(){
    pick.textContent=day&&time?day.dataset.l+'، ساعت '+time.textContent:'روز و ساعت را انتخاب کنید';
    pay.disabled=!(day&&time);
  }
  function group(id,cls,set){
    document.getElementById(id).addEventListener('click',function(e){
      var b=e.target.closest('.'+cls);if(!b||b.disabled)return;
      this.querySelectorAll('.'+cls).forEach(function(x){x.setAttribute('aria-pressed','false')});
      b.setAttribute('aria-pressed','true');set(b);upd();
    });
  }
  group('days','d',function(b){day=b});
  group('slots','t',function(b){time=b});
  pay.addEventListener('click',function(){pay.classList.add('done');pay.textContent='در حال انتقال به پرداخت…'});
  upd();
})();
</script>
</body>
</html>
