/* ===== Tokens: primitives -> semantic -> component ===== */
:root{
  /* space (base 4) */
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;--space-12:48px;
  /* radius */
  --radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:28px;--radius-pill:999px;
  /* type */
  --font:"Vazirmatn",Tahoma,"Segoe UI",system-ui,sans-serif;
  --fs-headline:28px;--lh-headline:1.4;
  --fs-body:16px;--lh-body:1.9;
  --fs-label:15px;--fs-button:17px;--lh-label:1.6;
  /* control heights */
  --h-control:56px;--h-target:48px;
  /* motion */
  --dur-micro:120ms;--dur-std:260ms;--ease:cubic-bezier(.2,.7,.2,1);
  /* color: light */
  --color-bg:#FAFAF7;
  --color-surface:#FFFFFF;
  --color-panel:#E6F0EC;
  --color-text:#14161A;
  --color-text-2:#464B53;
  --color-accent:#08574C;
  --color-accent-pressed:#064A41;
  --color-on-accent:#FFFFFF;
  --color-control-border:#7D838C;
  --color-track:#878F8B;
  --color-track-soft:#E3E8E5;
  --color-focus:#08574C;
  --color-amber:#946016;
  --color-neutral-mark:#6B7078;
  --color-toast-bg:#14161A;--color-toast-text:#FAFAF7;
}
@media (prefers-color-scheme:dark){:root{
  --color-bg:#0F1115;
  --color-surface:#171B21;
  --color-panel:#14271F;
  --color-text:#F2F3F5;
  --color-text-2:#B3B8C0;
  --color-accent:#5CCDB2;
  --color-accent-pressed:#46B89E;
  --color-on-accent:#0B1512;
  --color-control-border:#7A808B;
  --color-track:#5A626D;
  --color-track-soft:#262C34;
  --color-focus:#5CCDB2;
  --color-amber:#E3A94A;
  --color-neutral-mark:#8A8F99;
  --color-toast-bg:#F2F3F5;--color-toast-text:#0F1115;
}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--color-bg)}
body{margin:0;font-family:var(--font);color:var(--color-text);background:var(--color-bg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:"ss01" 0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px;border-radius:var(--radius-sm)}

/* ===== Screen ===== */
.screen{
  position:relative;max-width:430px;min-height:100vh;min-height:100dvh;margin:0 auto;
  display:flex;flex-direction:column;
  padding:max(var(--space-4),env(safe-area-inset-top)) var(--space-6) max(var(--space-6),env(safe-area-inset-bottom));
  overflow:hidden;
}

/* top bar: progress at the start (right), skip at the end (left) */
.topbar{display:flex;align-items:center;gap:var(--space-4);min-height:var(--h-target)}
.steps{flex:1;display:flex;align-items:center;gap:var(--space-2)}
.step{flex:1;height:32px;display:flex;align-items:center;transition:flex var(--dur-std) var(--ease)}
.step[aria-current="step"]{flex:2.4}
.step i{display:block;width:100%;height:4px;border-radius:var(--radius-pill);background:var(--color-track);transition:background var(--dur-std) var(--ease)}
.step.done i,.step[aria-current="step"] i{background:var(--color-accent)}
.skip{min-height:var(--h-target);min-width:64px;padding:0 var(--space-2);font-size:var(--fs-label);line-height:var(--lh-label);font-weight:600;color:var(--color-text-2);border-radius:var(--radius-sm);transition:color var(--dur-micro)}
.skip:active{color:var(--color-text)}

/* illustration panel */
.panel{flex:1 1 0;min-height:200px;position:relative;margin-top:var(--space-2);background:var(--color-panel);border-radius:var(--radius-xl);overflow:hidden;display:flex}
.panel svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.c-surface{fill:var(--color-surface)}
.c-accent{fill:var(--color-accent)}
.c-amber{fill:var(--color-amber)}
.c-neutral{fill:var(--color-neutral-mark)}
.c-soft{fill:var(--color-track-soft)}
.r-accent{stroke:var(--color-accent)}.r-amber{stroke:var(--color-amber)}.r-neutral{stroke:var(--color-neutral-mark)}
.ring{fill:none;stroke-width:16;transform:rotate(-90deg);transform-origin:246px 116px}

/* copy */
.copy{margin-top:var(--space-8)}
.slide{animation:in var(--dur-std) var(--ease) both}
.slide.fwd{--from:-24px}.slide.back{--from:24px}
@keyframes in{from{opacity:0;transform:translateX(var(--from,0))}to{opacity:1;transform:none}}
h1{margin:0;font-size:var(--fs-headline);line-height:var(--lh-headline);font-weight:800;text-wrap:balance;letter-spacing:0}
.copy p{margin:var(--space-3) 0 0;font-size:var(--fs-body);line-height:var(--lh-body);color:var(--color-text-2);max-width:34em;text-wrap:pretty}

/* actions */
.actions{margin-top:auto;padding-top:var(--space-6);display:flex;gap:var(--space-3)}
.btn{height:var(--h-control);border-radius:var(--radius-lg);display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);line-height:1;transition:background var(--dur-micro),transform var(--dur-micro),opacity var(--dur-std)}
.btn svg{width:20px;height:20px;flex:none}
.btn-primary{flex:1;background:var(--color-accent);color:var(--color-on-accent);font-size:var(--fs-button);font-weight:700}
.btn-primary:active{background:var(--color-accent-pressed);transform:scale(.985)}
.btn-primary:focus-visible{outline-offset:3px;border-radius:var(--radius-lg)}
.btn-ghost{min-width:104px;padding:0 var(--space-4);border:1.5px solid var(--color-control-border);font-size:var(--fs-label);font-weight:600;color:var(--color-text)}
.btn-ghost:active{background:var(--color-panel)}
.btn-ghost:focus-visible{border-radius:var(--radius-lg)}
.btn[aria-disabled="true"]{opacity:.38;pointer-events:none}

/* toast (simulated outcome of skip / last step) */
.toast{position:absolute;inset-inline:var(--space-6);top:calc(var(--space-4) + var(--h-target) + var(--space-2) + var(--space-4));padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);background:var(--color-toast-bg);color:var(--color-toast-text);font-size:var(--fs-label);line-height:var(--lh-label);text-align:center;opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity var(--dur-std) var(--ease),transform var(--dur-std) var(--ease)}
.toast.show{opacity:1;transform:none}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important}
  .slide{animation:fade .01ms both}
  @keyframes fade{from{opacity:.99}to{opacity:1}}
}
@media (max-height:700px){.panel{min-height:160px}.copy{margin-top:var(--space-6)}}
</style>
</head>
<body>
<main class="screen" id="screen">
  <div class="topbar">
    <nav class="steps" id="steps" aria-label="مراحل"></nav>
    <button class="skip" id="skip" type="button">رد کردن</button>
  </div>

  <div class="panel" id="panel" aria-hidden="true">
    <svg viewBox="0 0 342 440" preserveAspectRatio="xMidYMid meet" focusable="false">
      <!-- budget card -->
      <rect class="c-surface" x="16" y="16" width="310" height="200" rx="12"/>
      <circle class="ring r-accent"  cx="246" cy="116" r="52" pathLength="100" stroke-dasharray="53 47"/>
      <circle class="ring r-amber"   cx="246" cy="116" r="52" pathLength="100" stroke-dasharray="23 77" stroke-dashoffset="-55"/>
      <circle class="ring r-neutral" cx="246" cy="116" r="52" pathLength="100" stroke-dasharray="18 82" stroke-dashoffset="-80"/>
      <g>
        <circle class="c-accent" cx="166" cy="76" r="5"/><rect class="c-soft" x="40" y="71" width="110" height="10" rx="5"/><rect class="c-accent" x="68" y="71" width="82" height="10" rx="5"/>
        <circle class="c-amber" cx="166" cy="116" r="5"/><rect class="c-soft" x="40" y="111" width="110" height="10" rx="5"/><rect class="c-amber" x="98" y="111" width="52" height="10" rx="5"/>
        <circle class="c-neutral" cx="166" cy="156" r="5"/><rect class="c-soft" x="40" y="151" width="110" height="10" rx="5"/><rect class="c-neutral" x="120" y="151" width="30" height="10" rx="5"/>
      </g>
      <!-- transactions card -->
      <rect class="c-surface" x="16" y="232" width="310" height="192" rx="12"/>
      <g>
        <circle class="c-accent" cx="294" cy="268" r="12"/><rect class="c-soft" x="162" y="257" width="104" height="8" rx="4"/><rect class="c-soft" x="202" y="271" width="64" height="6" rx="3"/><rect class="c-neutral" x="40" y="264" width="48" height="8" rx="4"/>
        <circle class="c-amber" cx="294" cy="308" r="12"/><rect class="c-soft" x="178" y="297" width="88" height="8" rx="4"/><rect class="c-soft" x="210" y="311" width="56" height="6" rx="3"/><rect class="c-neutral" x="40" y="304" width="40" height="8" rx="4"/>
        <circle class="c-neutral" cx="294" cy="348" r="12"/><rect class="c-soft" x="170" y="337" width="96" height="8" rx="4"/><rect class="c-soft" x="206" y="351" width="60" height="6" rx="3"/><rect class="c-neutral" x="40" y="344" width="56" height="8" rx="4"/>
        <circle class="c-accent" cx="294" cy="388" r="12"/><rect class="c-soft" x="186" y="377" width="80" height="8" rx="4"/><rect class="c-soft" x="214" y="391" width="52" height="6" rx="3"/><rect class="c-neutral" x="40" y="384" width="44" height="8" rx="4"/>
      </g>
    </svg>
  </div>

  <section class="copy" id="copy" aria-live="polite"></section>

  <div class="actions">
    <button class="btn btn-ghost" id="prev" type="button">
      <!-- direction: "back" points right in RTL -->
      <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M224.49,136.49l-72,72a12,12,0,0,1-17-17L187,140H40a12,12,0,0,1,0-24H187L135.51,64.48a12,12,0,0,1,17-17l72,72A12,12,0,0,1,224.49,136.49Z"/></svg>
      <span>قبلی</span>
    </button>
    <button class="btn btn-primary" id="next" type="button">
      <span>بعدی</span>
      <!-- direction: "next" points left in RTL -->
      <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M228,128a12,12,0,0,1-12,12H69l51.52,51.51a12,12,0,0,1-17,17l-72-72a12,12,0,0,1,0-17l72-72a12,12,0,0,1,17,17L69,116H216A12,12,0,0,1,228,128Z"/></svg>
    </button>
  </div>
  <div class="toast" id="toast" role="status"></div>
</main>

<script>
(function(){
  // Real content = step 2 (from the original). Steps 1 and 3 have no source copy: bracketed placeholders.
  var slides=[
    {t:"[عنوان گام اول]",d:"[توضیح گام اول]"},
    {t:"مدیریت هوشمند هزینه‌ها",d:"تمام تراکنش‌های خود را در یک نگاه ببینید و برای هر دسته‌بندی بودجه تعیین کنید."},
    {t:"[عنوان گام سوم]",d:"[توضیح گام سوم]"}
  ];
  var i=1,N=slides.length;
  var steps=document.getElementById('steps'),copy=document.getElementById('copy'),
      prev=document.getElementById('prev'),next=document.getElementById('next'),
      skip=document.getElementById('skip'),toast=document.getElementById('toast'),tt;
  var fa=["اول","دوم","سوم"];
  for(var k=0;k<N;k++){(function(k){
    var b=document.createElement('button');b.type='button';b.className='step';
    b.setAttribute('aria-label','گام '+(k+1)+' از '+N);b.innerHTML='<i></i>';
    b.addEventListener('click',function(){go(k)});steps.appendChild(b);
  })(k)}
  function say(m){toast.textContent=m;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove('show')},2200)}
  function render(dir){
    var s=slides[i];
    copy.innerHTML='';
    var w=document.createElement('div');w.className='slide '+(dir||'');
    var h=document.createElement('h1');h.textContent=s.t;
    var p=document.createElement('p');p.textContent=s.d;
    w.appendChild(h);w.appendChild(p);copy.appendChild(w);
    [].forEach.call(steps.children,function(b,k){
      b.classList.toggle('done',k<i);
      if(k===i)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');
    });
    prev.setAttribute('aria-disabled',i===0?'true':'false');
  }
  function go(n){if(n===i||n<0||n>=N)return;var d=n>i?'fwd':'back';i=n;render(d)}
  prev.addEventListener('click',function(){go(i-1)});
  next.addEventListener('click',function(){if(i<N-1)go(i+1);else say('[ورود به برنامه]')});
  skip.addEventListener('click',function(){say('[ورود به برنامه]')});
  // RTL: next page lies to the left, so ArrowLeft = next, ArrowRight = previous; swipe right = next.
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft')go(i+1);else if(e.key==='ArrowRight')go(i-1);
  });
  var x0=null;
  var sc=document.getElementById('screen');
  sc.addEventListener('pointerdown',function(e){x0=e.clientX});
  sc.addEventListener('pointerup',function(e){
    if(x0===null)return;var dx=e.clientX-x0;x0=null;
    if(Math.abs(dx)>56){dx>0?go(i+1):go(i-1)}
  });
  render('');
})();
</script>
</body>
</html>
